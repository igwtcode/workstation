# Shared alacritty config, imported by the per-OS entry (linux.toml /
# mac.toml — the manifest links the right one to ~/.config/alacritty/
# alacritty.toml, which imports this file and overrides os-specifics).
# The importing file wins on conflicts (verified: alacritty merges imports
# first, then applies the file itself).

[general]
import = ["~/.config/alacritty/themes/colors.toml"]

[window]
padding = { x = 12, y = 7 }
opacity = 0.87

[font]
normal = { family = "GeistMono Nerd Font", style = "Medium" }
bold = { family = "GeistMono Nerd Font", style = "Medium" }
size = 12

[cursor]
style = { shape = "Block", blinking = "Off" }

[env]
TERM = "xterm-256color"
COLORTERM = "truecolor"
