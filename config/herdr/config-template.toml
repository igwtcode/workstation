# Rendered to config.toml by `mise run theme`. Edit this file, not that one.
# Keys mirror config/tmux/tmux.conf; herdr accepts an array per action.

[keys]
prefix = "ctrl+a"

# --- tabs (tmux windows) -----------------------------------------------------
new_tab = ["prefix+c", "alt+c"]
next_tab = ["prefix+n", "alt+n"]
previous_tab = ["prefix+p", "alt+p"]
rename_tab = ["prefix+shift+t", "prefix+comma"]
close_tab = ["prefix+shift+x", "prefix+ampersand"]

# --- panes -------------------------------------------------------------------
# bare ctrl+h/j/k/l are custom commands below, not focus_pane_* directly —
# they must check for nvim before deciding to forward the key or focus
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = ["prefix+v", "prefix+percent"]
split_horizontal = ["prefix+minus", "prefix+double_quote"]
zoom = ["prefix+z", "alt+z"]
last_pane = "prefix+semicolon"

# --- session -----------------------------------------------------------------
# reload and resize swap herdr's keys; one key on two actions disables one
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"
detach = ["prefix+d", "prefix+q"]
workspace_picker = ["prefix+w", "prefix+o"]

# --- vim-aware pane navigation (tmux's vim-tmux-navigator equivalent) -------
[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "$HOME/.config/herdr/nvim-nav.sh left"
description = "pane/vim-split navigate left"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "$HOME/.config/herdr/nvim-nav.sh down"
description = "pane/vim-split navigate down"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "$HOME/.config/herdr/nvim-nav.sh up"
description = "pane/vim-split navigate up"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "$HOME/.config/herdr/nvim-nav.sh right"
description = "pane/vim-split navigate right"

# --- popups (tmux M-g / tmux-toggle-popup equivalent) -------------------
[[keys.command]]
key = "alt+g"
type = "popup"
# mise's env hook only fires on prompt display, which a popup never shows —
# apply it explicitly so GH_CONFIG_DIR (identity zone) reaches lazygit
command = 'eval $(mise hook-env); exec lazygit'
description = "lazygit popup"
width = "99%"
height = "99%"

[terminal]
# default_shell unset = $SHELL; new_cwd defaults to "follow"

[ui]
prompt_new_tab_name = false
accent = "{{accent}}"

[theme]
name = "catppuccin"

[theme.custom]
accent = "{{accent}}"
panel_bg = "{{bg}}"
surface0 = "{{selection_bg}}"
surface1 = "{{border}}"
surface_dim = "{{bg_alt}}"
overlay0 = "{{color8}}"
overlay1 = "{{fg_dim}}"
text = "{{fg}}"
subtext0 = "{{fg_dim}}"
mauve = "{{color13}}"
green = "{{color10}}"
yellow = "{{color11}}"
red = "{{color9}}"
blue = "{{color12}}"
teal = "{{color14}}"
peach = "{{accent}}"
