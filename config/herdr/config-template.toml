# Rendered to config.toml by `mise run theme`. Edit this file, not that one.
# Keys mirror config/tmux/tmux.conf; herdr accepts an array per action.

[keys]
prefix = "ctrl+a"

# --- tabs (tmux windows) -----------------------------------------------------
new_tab = ["prefix+c", "alt+c"]
next_tab = ["prefix+n", "alt+n"]
previous_tab = ["prefix+p", "alt+p"]
rename_tab = ["prefix+shift+t", "prefix+comma"]
close_tab = ["prefix+shift+x", "prefix+ampersand"]

# --- panes -------------------------------------------------------------------
focus_pane_left = ["prefix+h", "ctrl+h"]
focus_pane_down = ["prefix+j", "ctrl+j"]
focus_pane_up = ["prefix+k", "ctrl+k"]
focus_pane_right = ["prefix+l", "ctrl+l"]
split_vertical = ["prefix+v", "prefix+percent"]
split_horizontal = ["prefix+minus", "prefix+double_quote"]
zoom = ["prefix+z", "alt+z"]
last_pane = "prefix+semicolon"

# --- session -----------------------------------------------------------------
# reload and resize swap herdr's keys; one key on two actions disables one
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"
detach = ["prefix+d", "prefix+q"]
workspace_picker = ["prefix+w", "prefix+o"]

[terminal]
# default_shell unset = $SHELL; new_cwd defaults to "follow"

[ui]
prompt_new_tab_name = false
accent = "{{accent}}"

[theme]
name = "catppuccin"

[theme.custom]
accent = "{{accent}}"
panel_bg = "{{bg}}"
surface0 = "{{selection_bg}}"
surface1 = "{{border}}"
surface_dim = "{{bg_alt}}"
overlay0 = "{{color8}}"
overlay1 = "{{fg_dim}}"
text = "{{fg}}"
subtext0 = "{{fg_dim}}"
mauve = "{{color13}}"
green = "{{color10}}"
yellow = "{{color11}}"
red = "{{color9}}"
blue = "{{color12}}"
teal = "{{color14}}"
peach = "{{accent}}"
