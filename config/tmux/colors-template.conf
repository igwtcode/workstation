# tmux colors for the active theme — rendered by `mise run theme` into
# colors.conf; edit this template only. tmux.conf sources the rendered file
# and builds all styling from these @thm_* variables.
# Backgrounds stay "default" so the terminal's (possibly transparent)
# background shows through.

set -gq @thm_bg "default"
set -gq @thm_bar_bg "default"
set -gq @thm_fg "{{fg}}"
set -gq @thm_accent "{{accent}}"
set -gq @thm_on_accent "{{bg}}"
set -gq @thm_surface "{{bg_alt}}"

# Status-bar accents: prefix-pending state and the two identity zones, so
# "am I about to run a command" and "which identity am I in" read at a
# glance without depending on the terminal's ANSI palette.
set -gq @thm_muted "{{fg_dim}}"
set -gq @thm_prefix "{{color9}}"
set -gq @thm_zone_work "{{color3}}"
set -gq @thm_zone_personal "{{color6}}"

# tmux-sessionx freezes its fzf --color string into @sessionx-_built-fzf-opts
# the moment TPM (re)sources its *.tmux file — which `run-shell`'s tpm at the
# bottom of tmux.conf does on every `source-file`, i.e. every theme switch.
# Setting this option here (before that tpm run) is what keeps the popup in
# sync without a server restart; same palette as fzf/colors-template.sh.
set -gq @sessionx-additional-options "--color=fg:{{fg}},bg:{{bg}},hl:{{accent}},fg+:{{selection_fg}}:bold,bg+:{{selection_bg}},hl+:{{accent}}:bold,gutter:{{bg}},query:{{fg}},disabled:{{fg_dim}},info:{{fg_dim}},border:{{border}},separator:{{border}},scrollbar:{{border}},prompt:{{accent}},pointer:{{accent}},marker:{{color2}},spinner:{{accent}},header:{{fg_dim}},label:{{fg_dim}}"

set -g status-bg "default"
set -g status-style "bg=default,fg=#{@thm_fg}"
set -g window-style "bg=default,fg=#{@thm_fg}"
set -g window-active-style "bg=default,fg=#{@thm_fg}"
