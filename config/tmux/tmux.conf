# set -g default-terminal "xterm-256color"
set -g default-terminal "tmux-256color"
# set -ga terminal-features ",*:usstyle"

set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'
# Set cursor style
#   Ps = 0  -> blinking block.
#   Ps = 1  -> blinking block (default).
#   Ps = 2  -> steady block.
#   Ps = 3  -> blinking underline.
#   Ps = 4  -> steady underline.
#   Ps = 5  -> blinking bar (xterm).
#   Ps = 6  -> steady bar (xterm).

# Undercurl
# set -g default-terminal "${TERM}"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
# set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# Enable automatic window renaming based on the current directory
setw -g automatic-rename on

# refresh name every secound
set -g status-interval 1

# Set ZSH as default for tmux
set -g default-shell /bin/zsh

# make windows and panes start at 1 rather than 0.
set -g base-index 1
setw -g pane-base-index 1

# don't exit from tmux when closing a session
set -g detach-on-destroy off

# zero-out escape time delay
set -g escape-time 0

# increase history size (from 2,000)
set -g history-limit 100000

# renumber all windows when any window is closed
set -g renumber-windows on

# use system clipboard
set -g set-clipboard on

# Enable Mouse support
set -g mouse on

set -g focus-events on
set -g display-time 1500
set -g mode-keys vi

# set prefix to Ctrl-a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Set Alt+n to go to the next window
bind -n M-n next-window
# Set Alt+p to go to the previous window
bind -n M-p previous-window

# Set Alt+z to toggle pane zoom
bind -n M-z resize-pane -Z

# Set Alt+c to open new window (in the current pane's directory — without
# -c, new-window starts in the directory the *session* was created in)
bind -n M-c new-window -c "#{pane_current_path}"

# Reload the tmux config key
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded..."

bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Resize panes using Alt + arrow keys
bind -n M-Left resize-pane -L 3
bind -n M-Right resize-pane -R 3
bind -n M-Up resize-pane -U 3
bind -n M-Down resize-pane -D 3

# Open new windows and panes in the current working directory
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}" -l 30

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '6'
set -g @continuum-restore 'on'

set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'o'
set -g @sessionx-filter-current 'false'
set -g @sessionx-window-height '36%'
set -g @sessionx-window-width '48%'
set -g @sessionx-preview-enabled 'false'
# set -g @sessionx-preview-ratio '60%'

set -g @plugin "loichyan/tmux-toggle-popup"
bind -n M-t run "#{@popup-toggle} -Ed'#{pane_current_path}' -w81% -h81%"
bind -n M-g run "#{@popup-toggle} -Ed'#{pane_current_path}' -w99% -h99% --name=lazygit lazygit"

# -q: colors.conf is rendered by `mise run theme` — absent until the first
# render on a fresh machine, and tmux should still start
source-file -q ~/.config/tmux/colors.conf

set -g mode-style "fg=#{@thm_accent},bg=#{@thm_surface}"

set -g message-style "fg=#{@thm_accent},bg=#{@thm_surface}"
set -g message-command-style "fg=#{@thm_accent},bg=#{@thm_surface}"

set -g pane-border-style "fg=#{@thm_surface}"
set -g pane-active-border-style "fg=#{@thm_accent}"

set -g status "on"
set -g status-justify "left"

set -g status-style "fg=#{@thm_accent},bg=#{@thm_bar_bg}"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

# Identity zone of the *focused pane* — derived from its cwd, so it tracks
# `cd` between ~/work and ~/personal instead of freezing at whatever the
# server was started in (the mise zone env never reaches the tmux server).
# The trailing "/" makes one pattern cover the zone root and everything
# under it, without ~/workspace matching ~/work. Empty outside every zone.
set -g @ws_zone "#{?#{m:#{HOME}/work/*,#{pane_current_path}/},work,#{?#{m:#{HOME}/personal/*,#{pane_current_path}/},personal,}}"
set -g @ws_zone_fg "#{?#{==:#{E:@ws_zone},work},#{@thm_zone_work},#{@thm_zone_personal}}"

# Prefix pending (= the next key is a tmux command, not shell input) flips
# the session block to @thm_prefix. Same trick for copy-mode.
set -g @ws_left_bg "#{?client_prefix,#{@thm_prefix},#{?pane_in_mode,#{@thm_zone_work},#{@thm_accent}}}"

set -g status-left "#[fg=#{@thm_on_accent},bg=#{E:@ws_left_bg},bold] #S #[fg=#{E:@ws_left_bg},bg=default,nobold,nounderscore,noitalics]"

# right: zone badge (hidden outside the zones) + date/time
set -g status-right "#[fg=#{E:@ws_zone_fg},bg=default,nobold]#{?#{E:@ws_zone}, #{E:@ws_zone} ,}#[fg=#{@thm_muted},bg=default,nobold] %a %d.%m %H:%M "

setw -g window-status-activity-style "underscore,fg=#{@thm_fg},bg=#{@thm_bar_bg}"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#{@thm_fg},bg=#{@thm_bar_bg}"
setw -g window-status-format "#[fg=#{@thm_bar_bg},bg=#{@thm_bar_bg},nobold,nounderscore,noitalics]#[default] #I / #W #F #[fg=#{@thm_bar_bg},bg=#{@thm_bar_bg},nobold,nounderscore,noitalics] "
setw -g window-status-current-format "#[fg=#{@thm_bar_bg},bg=#{@thm_surface},nobold,nounderscore,noitalics]#[fg=#{@thm_accent},bg=#{@thm_surface},bold] #I / #W #F #[fg=#{@thm_surface},bg=#{@thm_bar_bg},nobold,nounderscore,noitalics] "

# bootstrap tpm
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
