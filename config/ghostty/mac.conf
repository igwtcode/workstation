# vim: ft=conf
# Mac overrides — linked to ~/.config/ghostty/os.conf by links/mac.links.

# "" resets the list — font-family appends fallbacks otherwise
font-family = ""
font-family = "Liga SFMono Nerd Font"
font-style = SemiBold

font-size = 16
# SF Mono's natural line box is 1.19em vs Geist's 1.30em, so it needs more
# padding to land on the same rhythm
adjust-cell-height = 14%

window-theme = dark
window-padding-y = 9
window-padding-x = 11
window-padding-balance = true

background-opacity = 0.8

macos-non-native-fullscreen = false

# defaults to true only on U.S. layouts; tmux's M-* binds need it everywhere
macos-option-as-alt = true
