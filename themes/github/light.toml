# github light (GitHub Light Default) — colors from Primer primitives 7.10.0
# as consumed (with documented overrides) by the official VS Code theme:
# https://unpkg.com/@primer/primitives@7.10.0/dist/json/colors/light.json
# https://github.com/primer/github-vscode-theme/blob/main/src/colors.js
# fg/fg_dim use the theme's shipped overrides; cursor = accent
# (editorCursor); selection_bg = scale.blue[1] (upstream selection is an
# alpha blend — nearest published opaque hex); ANSI from the ansi scale

name = "github-light"
mode = "light"

bg = "#ffffff"
bg_alt = "#f6f8fa"
fg = "#1f2328"
fg_dim = "#656d76"
accent = "#0969da"
selection_bg = "#b6e3ff"
selection_fg = "#1f2328"
cursor = "#0969da"
border = "#d0d7de"

color0 = "#24292f"
color1 = "#cf222e"
color2 = "#116329"
color3 = "#4d2d00"
color4 = "#0969da"
color5 = "#8250df"
color6 = "#1b7c83"
color7 = "#6e7781"
color8 = "#57606a"
color9 = "#a40e26"
color10 = "#1a7f37"
color11 = "#633c01"
color12 = "#218bff"
color13 = "#a475f9"
color14 = "#3192aa"
color15 = "#8c959f"
