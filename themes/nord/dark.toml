# nord — palette + ANSI mapping from the upstream alacritty port:
# https://github.com/nordtheme/alacritty/blob/main/src/nord.yaml
# bg_alt = color0/nord1; selection_bg = nord3 (alacritty's bright black);
# fg_dim has no upstream source: nord jumps straight from nord3_gui_bright
# (2.4:1 against bg) to nord4 (9.3:1), so it is the former mixed 40% toward
# the latter, clearing 4.5:1 so dim text stays legible; accent = nord8
# (search match highlight); no official light palette is published upstream.
# color8 (ANSI bright black) = fg_dim: upstream's own value renders dim
# text near-invisible, and tools that ignore fg_dim reach for color8.

name = "nord-dark"
mode = "dark"

bg = "#2e3440"
bg_alt = "#3b4252"
fg = "#d8dee9"
fg_dim = "#919baf"
accent = "#88c0d0"
selection_bg = "#4c566a"
selection_fg = "#d8dee9"
cursor = "#d8dee9"
border = "#434c5e"

color0 = "#3b4252"
color1 = "#bf616a"
color2 = "#a3be8c"
color3 = "#ebcb8b"
color4 = "#81a1c1"
color5 = "#b48ead"
color6 = "#88c0d0"
color7 = "#e5e9f0"
color8 = "#919baf"
color9 = "#bf616a"
color10 = "#a3be8c"
color11 = "#ebcb8b"
color12 = "#81a1c1"
color13 = "#b48ead"
color14 = "#8fbcbb"
color15 = "#eceff4"
