# nord — palette + ANSI mapping from the upstream alacritty port:
# https://github.com/nordtheme/alacritty/blob/main/src/nord.yaml
# bg_alt = color0/nord1; selection_bg = nord3 (alacritty's bright black);
# fg_dim = nord3_gui_bright, the brightened nord3 the official vim port uses
# for Comment (nordtheme/vim colors/nord.vim) — plain nord3 sits too close
# to bg to read as dim text rather than invisible; accent = nord8 (search
# match highlight); no official light palette is published upstream.

name = "nord-dark"
mode = "dark"

bg = "#2e3440"
bg_alt = "#3b4252"
fg = "#d8dee9"
fg_dim = "#616e88"
accent = "#88c0d0"
selection_bg = "#4c566a"
selection_fg = "#d8dee9"
cursor = "#d8dee9"
border = "#434c5e"

color0 = "#3b4252"
color1 = "#bf616a"
color2 = "#a3be8c"
color3 = "#ebcb8b"
color4 = "#81a1c1"
color5 = "#b48ead"
color6 = "#88c0d0"
color7 = "#e5e9f0"
color8 = "#4c566a"
color9 = "#bf616a"
color10 = "#a3be8c"
color11 = "#ebcb8b"
color12 = "#81a1c1"
color13 = "#b48ead"
color14 = "#8fbcbb"
color15 = "#eceff4"
