# everforest light (medium contrast, the upstream default) — palette:
# https://github.com/sainnhe/everforest/blob/master/palette.md
# ANSI mapping from the colorscheme's own terminal colors
# (colors/everforest.vim: 0/8=fg, 7/15=bg3, bright == normal).
# selection_bg = bg_visual; border = bg4 (window separators); accent = green

name = "everforest-light"
mode = "light"

bg = "#fdf6e3"
